[project]
name = "runnify"
version = "0.1.0"
description = "Analyse how the music you listen to affects your running performance (Garmin + Spotify)."
requires-python = ">=3.13"
dependencies = [
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "fitparse>=1.2.0",
    "flask>=3.1.3",
    "flask-limiter>=4.1.1",
    "flask-login>=0.6.3",
    "flask-mail>=0.10.0",
    "flask-migrate>=4.1.0",
    "flask-sqlalchemy>=3.1.1",
    "flask-wtf>=1.3.0",
    "garminconnect>=0.3.17",
    "ijson>=3.5.1",
    "itsdangerous>=2.2.0",
    "psycopg2>=2.9.13",
    "pyotp>=2.10.0",
    "python-dotenv>=1.2.4",
    "segno>=1.6.6",
    "spotipy>=2.26.0",
    "sqlalchemy>=2.1.4",
    "werkzeug>=3.1.9",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["migrations"]  # generated by Alembic

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "UP",       # modern syntax
    "B",        # likely bugs
    "SIM",      # simplifications
    "C4",       # comprehensions
    "S",        # security (bandit)
    "RUF",      # ruff-specific
]
ignore = [
    "E501",     # long lines are left to the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts and dummy secrets are expected in tests
