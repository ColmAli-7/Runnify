[project]
name = "runnify"
version = "0.1.0"
description = "Analyse how the music you listen to affects your running performance (Garmin + Spotify)."
requires-python = ">=3.13"
dependencies = [
    "cryptography>=50.0.2",
    "fitparse>=1.2.0",
    "flask>=3.1.3",
    "flask-login>=0.6.3",
    "flask-mail>=0.10.0",
    "flask-sqlalchemy>=3.1.1",
    "garminconnect>=0.3.17",
    "ijson>=3.5.1",
    "itsdangerous>=2.2.0",
    "psycopg2>=2.9.13",
    "python-dotenv>=1.2.4",
    "spotipy>=2.26.0",
    "sqlalchemy>=2.1.4",
    "werkzeug>=3.1.9",
]
